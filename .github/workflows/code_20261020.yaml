name: Build Sesame-AG(dev) Debug APK
on:
  push:
    branches: [ dev ]
  pull_request:
    branches: [ dev ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: dev

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle Cache 加速依赖
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*','**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: 赋予gradlew执行权限
        run: chmod +x gradlew

      - name: 编译 Debug APK
        run: ./gradlew assembleDebug

      # =====新增调试步骤，打印输出目录！=====
      - name: 查看编译输出目录
        run: ls -R app/build/outputs/apk

      - name: 上传APK产物
        uses: actions/upload-artifact@v4
        with:
          name: sesame-ag-dev-debug
          path: app/build/outputs/apk/**/*.apk
          retention-days: 30
